{% extends "panel/base.html" %}

{% block panel %}
<h2>Товары</h2>
<p><a href="{% url 'panel-product-add' %}">+ Добавить товар</a></p>

<div class="table-wrap">
<table>
    <tr><th>Название</th><th>Описание</th><th>Цена</th><th></th></tr>
    {% for product in object_list %}
        <tr>
            <td>{{ product.name }}</td>
            <td>{{ product.description|truncatechars:60 }}</td>
            <td>{{ product.price }} ₽</td>
            <td>
                <a href="{% url 'panel-product-edit' product.pk %}">Изменить</a>
                <a href="{% url 'panel-product-delete' product.pk %}">Удалить</a>
            </td>
        </tr>
    {% empty %}
        <tr><td colspan="4">Товаров нет</td></tr>
    {% endfor %}
</table>
</div>
{% endblock %}
