{% if user.is_authenticated %}
    <form method="post" action="{% url 'cart-add' product.pk %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <button type="submit" class="to-cart" aria-label="В корзину">В корзину</button>
    </form>
{% else %}
    <a class="to-cart" href="{% url 'web-login' %}?next={{ request.get_full_path|urlencode }}">В корзину</a>
{% endif %}
