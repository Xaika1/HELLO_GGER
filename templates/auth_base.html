{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hello Kitty{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body class="auth">
    <div class="auth-box">
        <img class="auth-kitty" src="{% static 'img/kitty.png' %}" alt="">
        <a class="logo" href="{% url 'index' %}">Hello Kitty<img class="logo-bow" src="{% static 'img/bow.svg' %}" alt=""></a>
        {% include "includes/messages.html" %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
